<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ongkos Muatan Mobil</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d21;--muted:#6b7280;--line:#e5e7eb;--accent:#1d6fe0;--accent-t:#fff;--danger:#d93b3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--card:#1b1e24;--text:#eceef1;--muted:#9aa1ad;--line:#2b2f37;--accent:#4d93f5;--accent-t:#0b1220;--danger:#f07070}}
:root[data-theme="dark"]{--bg:#111317;--card:#1b1e24;--text:#eceef1;--muted:#9aa1ad;--line:#2b2f37;--accent:#4d93f5;--accent-t:#0b1220;--danger:#f07070}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 90px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 0 10px;z-index:5}
h1{font-size:20px;margin:0 0 10px}
.search{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none}
.search:focus{border-color:var(--accent)}
.count{font-size:13px;color:var(--muted);margin:8px 2px 0}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:8px}
.item .n{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .p{font-weight:700;color:var(--accent);white-space:nowrap}
.item .k{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.ico{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px;cursor:pointer}
.ico.del:hover{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-t);border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,400px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input.f{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:10px;font-size:16px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.row .ok{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🚚 Ongkos Muatan Mobil</h1>
<input id="q" class="search" type="search" placeholder="Cari daerah atau kabupaten…" autocomplete="off">
<div class="count" id="count"></div>
</header>
<div id="list"></div>
<div class="note">Data awal hanyalah contoh. Ketuk ✏️ untuk mengubah, atau tambah daerah baru.</div>
</div>
<button class="fab" id="add">+ Tambah</button>

<dialog id="dlg">
<h2 id="dt">Tambah Daerah</h2>
<label for="nm">Nama daerah</label>
<input id="nm" class="f" type="text" autocomplete="off">
<label for="kb">Kabupaten</label>
<input id="kb" class="f" type="text" autocomplete="off">
<label for="pr">Ongkos mobil (Rp)</label>
<input id="pr" class="f" type="number" inputmode="numeric" min="0">
<div class="row"><button id="cancel">Batal</button><button class="ok" id="save">Simpan</button></div>
</dialog>

<script>
var KEY="ongkos-muatan-v1";
var DEFAULT=[
{n:"Jakarta",k:"Kota Jakarta Pusat",p:350000},{n:"Cibinong",k:"Kab. Bogor",p:450000},{n:"Depok",k:"Kota Depok",p:400000},{n:"Tigaraksa",k:"Kab. Tangerang",p:400000},
{n:"Cikarang",k:"Kab. Bekasi",p:380000},{n:"Soreang",k:"Kab. Bandung",p:850000},{n:"Sumber",k:"Kab. Cirebon",p:1300000},{n:"Ungaran",k:"Kab. Semarang",p:2000000},
{n:"Sleman",k:"Kab. Sleman",p:2400000},{n:"Sidoarjo",k:"Kab. Sidoarjo",p:3200000}];
var data=load(), editing=-1;
function load(){try{var s=localStorage.getItem(KEY);if(s){var a=JSON.parse(s);if(Array.isArray(a))return a}}catch(e){}return DEFAULT.slice()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function rp(n){return "Rp "+Number(n).toLocaleString("id-ID")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
 var t=document.getElementById("q").value.trim().toLowerCase();
 var rows=data.map(function(d,i){return{d:d,i:i}}).filter(function(x){return (x.d.n+" "+(x.d.k||"")).toLowerCase().indexOf(t)>-1})
  .sort(function(a,b){return a.d.n.localeCompare(b.d.n,"id")});
 document.getElementById("count").textContent=rows.length+" dari "+data.length+" daerah";
 document.getElementById("list").innerHTML=rows.length?rows.map(function(x){
  return '<div class="item"><span class="n">'+esc(x.d.n)+(x.d.k?'<span class="k">'+esc(x.d.k)+'</span>':'')+'</span><span class="p">'+rp(x.d.p)+'</span>'+
  '<button class="ico" data-e="'+x.i+'" aria-label="Ubah">✏️</button><button class="ico del" data-d="'+x.i+'" aria-label="Hapus">🗑️</button></div>'
 }).join(""):'<div class="empty">Daerah tidak ditemukan.</div>';
}
var dlg=document.getElementById("dlg"),nm=document.getElementById("nm"),kb=document.getElementById("kb"),pr=document.getElementById("pr");
function openDlg(i){editing=i;document.getElementById("dt").textContent=i<0?"Tambah Daerah":"Ubah Data";
 nm.value=i<0?"":data[i].n;kb.value=i<0?"":(data[i].k||"");pr.value=i<0?"":data[i].p;dlg.showModal();nm.focus()}
document.getElementById("add").onclick=function(){openDlg(-1)};
document.getElementById("cancel").onclick=function(){dlg.close()};
document.getElementById("save").onclick=function(){
 var n=nm.value.trim(),k=kb.value.trim(),p=parseInt(pr.value,10);
 if(!n||isNaN(p)||p<0){return}
 if(editing<0)data.push({n:n,k:k,p:p});else data[editing]={n:n,k:k,p:p};
 persist();dlg.close();render();
};
document.getElementById("q").oninput=render;
document.getElementById("list").onclick=function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.e!==undefined)openDlg(+b.dataset.e);
 else if(b.dataset.d!==undefined){var i=+b.dataset.d;if(confirm("Hapus "+data[i].n+"?")){data.splice(i,1);persist();render()}}
};
render();
</script>
</body>
</html>
